spring.application.name=demo

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8081}


# JWT mismo secret que IAM
jwt.secret=${JWT_SECRET:edifika-secret-key-must-be-at-least-32-characters-long}
jwt.expiration.days=${JWT_EXPIRATION_DAYS:365}

# RabbitMQ (patrón edifika.events, DLQ por cola)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
# IAM interno (pre-chequeo E3, ver docs/adr/0001)
app.iam-base-url=${IAM_BASE_URL:http://localhost:8081}
app.internal-api-token=${APP_INTERNAL_TOKEN:dev-internal-token}

# Retry cableado en RabbitMqConfiguration#retryOperationsInterceptor (el factory custom
# ignora spring.rabbitmq.listener.simple.retry.*; esas properties se eliminaron a propósito).

